name: Bug report
description: Report a reproducible problem in this repository.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities or private information here. Follow the organization's Security policy instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest repeatable sequence, relevant files, and building ID where applicable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "Release, tag, or commit SHA"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser or Python version, and city repository where applicable.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report contains no credentials, private information, or confidential evidence.
          required: true
